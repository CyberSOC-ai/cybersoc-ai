services:
  qdrant:
    profiles: ["vector"]
    image: qdrant/qdrant:v1.20.0@sha256:2d1b0bfd0a961275481ea09400fc98008216ae54e1b52ed7d24520d63050c644
    platform: linux/amd64
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant-storage:/qdrant/storage
  dev:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.dev
    volumes:
      - .:/workspace:ro
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.dev
    command: ["uvicorn", "backend.app:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    environment:
      CYBERSOC_RUNTIME_DIR: /runtime
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/workspace:ro
      - api-runtime:/runtime
volumes:
  qdrant-storage:
    name: cybersoc-s2t02-qdrant
  api-runtime:

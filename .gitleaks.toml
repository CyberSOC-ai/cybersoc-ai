# Keep all default rules; these exact public BGE identities are not credentials.
[extend]
useDefault = true

[[allowlists]]
description = "Public BAAI/bge-small-en-v1.5 revision and tokenizer SHA-256"
regexTarget = "secret"
regexes = [
  '^5c38ec7c405ec4b44b94cc5a9bb96e735b38267a$',
  '^d241a60d5e8f04cc1b2b3e9ef7a4921b27bf526d9f6050ab90f9267a1f9e5c66$',
]

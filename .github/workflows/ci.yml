name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-checks:
    name: repository-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_COMMENTS: "false"
      - name: Check repository integrity
        run: python3 infrastructure/ci/check_repository.py
      - name: Build development image
        run: docker compose build dev
      - name: Check Python code
        run: docker compose run --rm -T dev ruff check --no-cache .
      - name: Run contract tests
        run: docker compose run --rm -T dev python -B -m unittest discover -s tests/contracts -v
      - name: Run evaluation tests
        run: docker compose run --rm -T dev python -B -m unittest discover -s tests/evaluation -v

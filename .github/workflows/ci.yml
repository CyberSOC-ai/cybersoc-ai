name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-checks:
    name: repository-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check changed whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git diff --check "$BASE_SHA" HEAD
          fi
      - name: Check repository integrity
        run: python3 infrastructure/ci/check_repository.py
      - name: Set up Python for contract tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install contract test dependencies
        run: python -m pip install -r tests/contracts/requirements.txt
      - name: Run contract tests
        run: python -B -m unittest discover -s tests/contracts -v
